<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kalkulator">
        <h1>Kalkulator Sederhana</h1>
        <p>Masukkan dua angka:</p>

        <input type="number" id="angka1" placeholder="Angka pertama">
        <input type="number" id="angka2" placeholder="Angka kedua">

        <div class="tombol">
            <button type="button" onclick="tambahAngka()">Tambah</button>
            <button type="button" onclick="kurangAngka()">Kurang</button>
            <button type="button" onclick="kaliAngka()">Kali</button>
            <button type="button" onclick="bagiAngka()">Bagi</button>
            <button type="button" onclick="modulusAngka()">Modulus</button>
        </div>

        <p id="hasil"></p>
        <button type="button" onclick="reset()">Reset</button>
    </div>
</body>
</html>
